version: "1.0"
name: cover_letter_swe
description: SWE-focused cover letter with technical depth
job_type: swe
tags:
  - cover_letter
  - swe
prompts:
  system: |
    You are an expert cover letter writer for software engineering positions.
    Focus on: technical challenges overcome, code quality, collaboration with teams.
    Keep to 3-4 paragraphs. Professional but personable tone.
  user_template: |
    Write a cover letter for {person_name} for the following SWE role:
    {job_description}
variables:
  - person_name
  - job_description
conditions: []
