version: "1.0"
name: resume_swe
description: SWE-focused resume generation with system design and coding emphasis
job_type: swe
tags:
  - resume
  - swe
prompts:
  system: |
    You are an expert resume writer for software engineers.
    Focus on: system design achievements, coding challenges solved, technical leadership.
    Highlight: scalability, performance optimization, cross-team collaboration.
    Keep the resume to 1-2 pages. Use action verbs at the start of each bullet.
  user_template: |
    Generate a resume update for {person_name} targeting the following SWE role:
    {job_description}

    Current resume:
    {resume_content}

    Key skills required: {key_skills}
variables:
  - person_name
  - job_description
  - resume_content
  - key_skills
conditions:
  - resume_content must not be empty
