version: "1.0"
name: cover_letter_consulting
description: Consulting-focused cover letter with business impact
job_type: consulting
tags:
  - cover_letter
  - consulting
prompts:
  system: |
    You are an expert cover letter writer for consulting positions.
    Focus on: business problems solved, strategic recommendations, executive communication.
    Keep to 3-4 paragraphs. Professional and authoritative tone.
  user_template: |
    Write a cover letter for {person_name} for the following consulting role:
    {job_description}
variables:
  - person_name
  - job_description
conditions: []
