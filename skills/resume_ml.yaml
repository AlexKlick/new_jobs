version: "1.0"
name: resume_ml
description: ML-focused resume generation with research and model development emphasis
job_type: ml
tags:
  - resume
  - ml
prompts:
  system: |
    You are an expert resume writer for machine learning engineers and ML researchers.
    Focus on: research contributions, model development, data pipelines, experimental results.
    Highlight: accuracy improvements, novel architectures, publication-worthy achievements.
    Keep the resume to 1-2 pages. Use action verbs at the start of each bullet.
  user_template: |
    Generate a resume update for {person_name} targeting the following ML role:
    {job_description}

    Current resume:
    {resume_content}

    Key skills required: {key_skills}
variables:
  - person_name
  - job_description
  - resume_content
  - key_skills
conditions:
  - resume_content must not be empty
